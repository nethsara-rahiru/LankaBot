<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — LankaBot Portal</title>
    <meta name="description" content="Sign in to manage your WhatsApp business account on LankaBot.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-page">

<div style="width:100%;max-width:380px;">

    <!-- Brand -->
    <a href="/portal" class="brand" style="justify-content:center;margin-bottom:2.25rem;text-decoration:none;">
        <div class="brand-dot"></div>
        <span class="brand-name">Lanka<span>Bot</span> Portal</span>
    </a>

    <!-- Card -->
    <div class="card">
        <h1 style="font-size:1.35rem;margin-bottom:0.3rem;">Welcome back</h1>
        <p style="margin-bottom:1.5rem;">Sign in to manage your WhatsApp connection.</p>

        <div id="alert" class="alert alert-error"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required>
            </div>
            <div class="form-group" style="margin-bottom:1.5rem;">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                Sign in
            </button>
        </form>
    </div>

    <p style="text-align:center;margin-top:1.25rem;font-size:0.83rem;color:#9ca3af;">
        LankaBot &nbsp;·&nbsp; <a href="/">Admin Dashboard</a>
    </p>
</div>

<script src="app.js"></script>
<script>
    // If already logged in go straight to dashboard
    if (getToken()) window.location.replace('/portal/dashboard.html');

    const form      = document.getElementById('loginForm');
    const alertEl   = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert(alertEl);

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showAlert(alertEl, 'Please enter your email and password.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';

        try {
            const data = await apiFetch('/api/users/login', {
                method: 'POST',
                body: { email, password }
            });

            saveAuth(data.token, { name: data.name, email: data.email, role: data.role });
            window.location.replace('/portal/dashboard.html');

        } catch (err) {
            showAlert(alertEl, err.message || 'Invalid email or password.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign in';
        }
    });
</script>
</body>
</html>
