<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Accounts — FrontDesk Agent Portal</title>
    <meta name="description" content="Manage your WhatsApp business accounts on FrontDesk Agent.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .page { padding: 2rem 0 4rem; }
        .page-title { margin-bottom: 0.25rem; }
        .page-sub   { margin-bottom: 1.75rem; }
        .accounts-list { display: flex; flex-direction: column; gap: 0.85rem; }

        /* share dropdown */
        .share-dropdown {
            position: relative;
            display: inline-block;
        }
        .share-panel {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 1rem;
            width: 300px;
            z-index: 100;
        }
        .share-panel.open { display: block; }
        .share-panel h3  { margin-bottom: 0.35rem; }
        .share-panel p   { font-size: 0.82rem; margin-bottom: 0.75rem; line-height: 1.4; }
    </style>
</head>
<body>

<!-- Top Bar -->
<header class="topbar">
    <a href="/portal/dashboard.html" class="brand" style="margin-bottom:0;">
        <div class="brand-dot"></div>
        <span class="brand-name">FrontDesk <span>Agent</span></span>
    </a>
    <div class="topbar-right">
        <span class="topbar-user" id="userLabel"></span>
        <button class="btn btn-ghost btn-sm" onclick="logout()" id="logoutBtn">Sign out</button>
    </div>
</header>

<!-- Main -->
    <!-- API Key & Integration Section -->
    <div class="card" style="background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; margin-bottom:2rem; box-shadow:var(--shadow-sm);">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:1rem;">
            <div>
                <h2 style="font-size:1.2rem; font-weight:700; color:var(--text-main); margin-bottom:0.25rem;">🔑 API Key & External Integration</h2>
                <p style="font-size:0.88rem; color:var(--text-sub);">Send WhatsApp messages programmatically from external systems, CRMs, or webhooks.</p>
            </div>
            <div style="display:flex; gap:0.5rem;">
                <a href="/portal/docs.html" class="btn btn-outline btn-sm">📖 View API Docs</a>
                <button class="btn btn-ghost btn-sm" onclick="toggleTestMessageForm()">💬 Test API Message</button>
            </div>
        </div>

        <div style="display:flex; gap:0.5rem; align-items:center; max-width:600px; margin-bottom:1rem;">
            <input type="password" id="portalApiKeyInput" value="Loading key…" readonly style="font-family:monospace; flex:1; padding:0.55rem 0.8rem; border:1px solid var(--border); border-radius:6px; background:#f8fafc; font-size:0.9rem;">
            <button class="btn btn-outline btn-sm" onclick="toggleApiKeyVisibility(this)">Show</button>
            <button class="btn btn-outline btn-sm" onclick="copyPortalApiKey(this)">Copy</button>
            <button class="btn btn-ghost btn-sm" style="color:#dc2626;" onclick="handleRegenerateKey()">Regenerate</button>
        </div>

        <!-- Inline Test Form -->
        <div id="testApiForm" style="display:none; background:#f8fafc; border:1px dashed var(--border); border-radius:8px; padding:1.25rem; margin-top:1rem;">
            <h3 style="font-size:0.95rem; font-weight:600; margin-bottom:0.75rem; color:var(--text-main);">Send Test External Message</h3>
            <div style="display:flex; flex-direction:column; gap:0.75rem; max-width:500px;">
                <div>
                    <label style="display:block; font-size:0.8rem; font-weight:600; color:var(--text-sub); margin-bottom:0.25rem;">Recipient Phone Number</label>
                    <input type="text" id="testReceiverPhone" placeholder="e.g. 94771234567" style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border); border-radius:6px;">
                </div>
                <div>
                    <label style="display:block; font-size:0.8rem; font-weight:600; color:var(--text-sub); margin-bottom:0.25rem;">Message Content</label>
                    <textarea id="testMessageText" rows="3" placeholder="Enter test message…" style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border); border-radius:6px; font-family:inherit;"></textarea>
                </div>
                <div style="display:flex; gap:0.5rem;">
                    <button class="btn btn-primary btn-sm" onclick="sendTestExternalMessage(this)">Send Message</button>
                    <button class="btn btn-ghost btn-sm" onclick="toggleTestMessageForm()">Cancel</button>
                </div>
                <div id="testApiResult" style="display:none; font-size:0.85rem; font-weight:600; padding:0.5rem; border-radius:6px;"></div>
            </div>
        </div>
    </div>

    <h2 style="font-size:1.2rem; font-weight:700; margin-bottom:0.75rem;">My Accounts</h2>
    <div id="accountsList" class="accounts-list">
        <!-- Loading placeholder -->
        <div style="padding:2rem;text-align:center;color:var(--text-sub);">
            <div class="spinner" style="margin:0 auto 0.75rem;width:22px;height:22px;border-width:2.5px;"></div>
            Loading accounts…
        </div>
    </div>
</main>

<!-- Close share panels when clicking outside -->
<script src="app.js"></script>
<script>
    if (!requireAuth()) throw new Error('redirect');

    const user = getUser();
    if (user) document.getElementById('userLabel').textContent = user.name || user.email;

    function logout() {
        clearAuth();
        window.location.href = '/portal/login.html';
    }

    // Close any open share panel when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.share-dropdown')) {
            document.querySelectorAll('.share-panel.open').forEach(p => p.classList.remove('open'));
        }
    });

    // ─── Load Accounts ────────────────────────────────────────
    async function loadAccounts() {
        const list = document.getElementById('accountsList');
        const alertEl = document.getElementById('alert');
        try {
            const accounts = await apiFetch('/api/accounts');
            renderAccounts(accounts, list);
        } catch (err) {
            if (err.status === 401) { clearAuth(); window.location.href = '/portal/login.html'; return; }
            list.innerHTML = '';
            showAlert(alertEl, 'Failed to load accounts. ' + err.message);
        }
    }

    function renderAccounts(accounts, list) {
        if (!accounts || accounts.length === 0) {
            list.innerHTML = `<div class="empty-state">
                <div class="empty-state-icon">📵</div>
                <h3>No accounts yet</h3>
                <p>Contact your administrator to set up a WhatsApp account.</p>
            </div>`;
            return;
        }

        list.innerHTML = accounts.map(acc => accountCard(acc)).join('');
    }

    function accountCard(acc) {
        const badge  = statusBadge(acc.status);
        const phone  = acc.phoneNumber ? `+${acc.phoneNumber}` : 'Not connected';
        const avatar = acc.profilePic
            ? `<img src="${acc.profilePic}" alt="Profile" onerror="this.style.display='none'">`
            : `<span style="font-size:1.2rem;">📱</span>`;

        const canConnect    = acc.status === 'disconnected' || acc.status === 'qr';
        const canReconnect  = acc.status === 'ready';

        const connectBtn = canConnect
            ? `<a href="/portal/connect.html?id=${acc._id}" class="btn btn-outline btn-sm">Connect</a>`
            : '';
        const reconnectBtn = canReconnect
            ? `<a href="/portal/connect.html?id=${acc._id}" class="btn btn-ghost btn-sm">Reconnect</a>`
            : '';

        const shareLink = buildShareLink(acc._id);

        return `
        <div class="account-card" id="card-${acc._id}">
            <div class="account-avatar">${avatar}</div>
            <div class="account-info">
                <div class="account-name">${escHtml(acc.organizationName)}</div>
                <div class="account-phone">${escHtml(phone)}</div>
                <div style="margin-top:0.4rem;">${badge}</div>
            </div>
            <div class="account-actions">
                ${connectBtn}
                ${reconnectBtn}
                <div class="share-dropdown">
                    <button class="btn btn-ghost btn-sm" onclick="toggleShare(event,'share-${acc._id}')">
                        Share Link
                    </button>
                    <div class="share-panel" id="share-${acc._id}">
                        <h3>Connection link</h3>
                        <p>Share this link with the WhatsApp number owner so they can scan the QR code from any device.</p>
                        <div class="share-box">
                            <input type="text" value="${escHtml(shareLink)}" readonly id="shareInput-${acc._id}">
                            <button class="btn btn-outline btn-sm" onclick="copyLink('${acc._id}', this)">Copy</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
    }

    function toggleShare(e, panelId) {
        e.stopPropagation();
        const panel = document.getElementById(panelId);
        const isOpen = panel.classList.contains('open');
        document.querySelectorAll('.share-panel.open').forEach(p => p.classList.remove('open'));
        if (!isOpen) panel.classList.add('open');
    }

    async function copyLink(accountId, btn) {
        const input = document.getElementById(`shareInput-${accountId}`);
        await copyToClipboard(input.value, btn);
    }

    function escHtml(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ─── Real-time status updates via Socket.io ───────────────
    loadSocket((socket) => {
        socket.on('account_ready', ({ accountId }) => updateCard(accountId, 'ready'));
        socket.on('account_disconnected', ({ accountId }) => updateCard(accountId, 'disconnected'));
    });

    function updateCard(accountId, newStatus) {
        const card = document.getElementById(`card-${accountId}`);
        if (!card) return;
        const badgeEl = card.querySelector('.badge');
        if (badgeEl) badgeEl.outerHTML = statusBadge(newStatus);
        // Refresh action buttons
        loadAccounts();
    }

    // Initial load
    loadAccounts();
    initApiKey();

    // ─── API Key Management Functions ─────────────────────────
    let currentApiKey = '';

    async function initApiKey() {
        const input = document.getElementById('portalApiKeyInput');
        try {
            currentApiKey = await fetchApiKey();
            if (input) input.value = currentApiKey;
        } catch (err) {
            if (input) input.value = 'Failed to load key';
        }
    }

    function toggleApiKeyVisibility(btn) {
        const input = document.getElementById('portalApiKeyInput');
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = 'Hide';
        } else {
            input.type = 'password';
            btn.textContent = 'Show';
        }
    }

    async function copyPortalApiKey(btn) {
        if (!currentApiKey) return;
        await copyToClipboard(currentApiKey, btn);
    }

    async function handleRegenerateKey() {
        if (!confirm('Are you sure you want to regenerate your API key? Any external scripts using your current API key will be revoked.')) return;
        const input = document.getElementById('portalApiKeyInput');
        try {
            currentApiKey = await regenerateApiKey();
            if (input) input.value = currentApiKey;
            alert('Your API Key has been regenerated successfully.');
        } catch (err) {
            alert('Failed to regenerate API Key: ' + err.message);
        }
    }

    function toggleTestMessageForm() {
        const form = document.getElementById('testApiForm');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    async function sendTestExternalMessage(btn) {
        const phone = document.getElementById('testReceiverPhone').value.trim();
        const text = document.getElementById('testMessageText').value.trim();
        const resultEl = document.getElementById('testApiResult');

        if (!phone || !text) {
            resultEl.style.display = 'block';
            resultEl.style.background = '#fee2e2';
            resultEl.style.color = '#dc2626';
            resultEl.textContent = 'Please provide both recipient phone number and message content.';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Sending…';
        resultEl.style.display = 'none';

        try {
            const res = await fetch('/api/external/send-message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': currentApiKey
                },
                body: JSON.stringify({ receiverNumber: phone, message: text })
            });

            const data = await res.json();
            resultEl.style.display = 'block';

            if (res.ok && data.success) {
                resultEl.style.background = '#dcfce7';
                resultEl.style.color = '#16a34a';
                resultEl.textContent = `✅ Message sent successfully! Message ID: ${data.data.messageId}`;
            } else {
                resultEl.style.background = '#fee2e2';
                resultEl.style.color = '#dc2626';
                resultEl.textContent = `❌ Error: ${data.msg || 'Failed to send message'}`;
            }
        } catch (err) {
            resultEl.style.display = 'block';
            resultEl.style.background = '#fee2e2';
            resultEl.style.color = '#dc2626';
            resultEl.textContent = `❌ Network Error: ${err.message}`;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Send Message';
        }
    }
</script>
</body>
</html>
