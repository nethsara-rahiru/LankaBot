<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrontDesk | Catalog Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .catalog-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .catalog-card {
            background: var(--glass-heavy, rgba(255, 255, 255, 0.05));
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }

        .catalog-card:hover {
            transform: translateY(-4px);
            border-color: rgba(var(--primary-rgb), 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .type-product {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }

        .type-service {
            background: rgba(155, 89, 182, 0.2);
            color: #9b59b6;
        }

        .item-status {
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-available {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        .status-out_of_stock {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .fields-list {
            margin: 1rem 0;
            font-size: 0.85rem;
            color: var(--text-dim, rgba(255, 255, 255, 0.7));
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .field-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 0.2rem;
        }

        .btn-secondary.active-filter {
            background: rgba(var(--primary-rgb), 0.2);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #181b20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <button class="icon-btn" onclick="window.location.href='/manageAccount.html'" title="Back to Dashboard">
                    <i class="ph-bold ph-arrow-left"></i>
                </button>
                <div class="logo-wrapper">
                    <i class="ph-fill ph-storefront logo-icon" style="color: #9b59b6;"></i>
                    <div class="logo">
                        <h1>Catalog<span>Manager</span></h1>
                        <p>Manage products & services</p>
                    </div>
                </div>
            </div>
        </header>

        <main style="margin-top: 1.5rem; display: block;">
            <div class="catalog-header-actions">
                <div id="filter-buttons" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn-secondary active-filter" onclick="filterCatalog('', this)">All Items</button>
                    <!-- Type filter buttons loaded dynamically from DB settings -->
                </div>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn-secondary" onclick="openTypesModal()">
                        <i class="ph-bold ph-plus-circle"></i> Manage Types
                    </button>
                    <button class="btn-secondary" onclick="window.location.href='/catalogMenuStyle.html'">
                        <i class="ph-bold ph-palette"></i> Menu Style
                    </button>
                    <button class="btn-secondary" onclick="window.location.href='/catalogItemCard.html'">
                        <i class="ph-bold ph-card"></i> Item Card
                    </button>
                    <button class="btn-primary" onclick="openCreateModal()">
                        <i class="ph-bold ph-plus"></i> Add Item
                    </button>
                </div>
            </div>

            <div id="catalog-container" class="catalog-grid">
                <!-- Catalog cards will be rendered here -->
            </div>
        </main>
    </div>

    <!-- Create/Edit Modal -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1.5rem;">Add Catalog Item</h2>
            <form id="item-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="item-id">

                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.4rem;">Type</label>
                    <select id="item-type"
                        style="width: 100%; padding: 0.7rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
                        <!-- Loaded dynamically from customCatalogTypes -->
                    </select>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.4rem;">Item Name *</label>
                    <input type="text" id="field-name" required placeholder="e.g. Fresh Milk 500ml or Hair Cut"
                        style="width: 100%; padding: 0.7rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.4rem;">Price</label>
                    <input type="number" id="field-price" placeholder="e.g. 1500"
                        style="width: 100%; padding: 0.7rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.4rem;">Status</label>
                    <input type="text" id="item-status" placeholder="e.g. available, out_of_stock, seasonal"
                        value="available"
                        style="width: 100%; padding: 0.7rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.4rem;">Media ID / Image ID (from Storage)</label>
                    <input type="text" id="field-image-id" placeholder="e.g. 64f1a2b3c4d5e6f7a8b9c0d1"
                        style="width: 100%; padding: 0.7rem; border-radius: 10px; background: rgba(52, 152, 219, 0.05); color: #fff; border: 1px solid rgba(52, 152, 219, 0.2);">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.4rem;">Category / Additional
                        Details</label>
                    <input type="text" id="field-category" placeholder="e.g. Dairy or Salon Services"
                        style="width: 100%; padding: 0.7rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.4rem;">Description</label>
                    <textarea id="field-description" placeholder="e.g. Fresh full-cream milk, sourced locally from Sri Lankan farms..."
                        style="width: 100%; padding: 0.7rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); resize: vertical; min-height: 80px; font-family: inherit; font-size: 0.9rem; line-height: 1.5;"></textarea>
                </div>

                <div style="margin-bottom: 1.5rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label style="font-size: 0.85rem; font-weight: 600;">Variants & Pricing</label>
                        <button type="button" class="btn-secondary" onclick="addVariantRow()" style="padding: 0.35rem 0.7rem; font-size: 0.78rem;">
                            <i class="ph-bold ph-plus"></i> Add Variant
                        </button>
                    </div>
                    <p style="font-size: 0.75rem; color: var(--text-dim, rgba(255,255,255,0.6)); margin-bottom: 0.8rem;">Optionally add variants (e.g. 500g, 1kg, Red / L) with individual prices.</p>
                    <div id="variants-list" style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 180px; overflow-y: auto;">
                        <!-- Dynamic variant rows -->
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.8rem;">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Types Modal -->
    <div id="types-modal" class="modal">
        <div class="modal-content" style="max-width: 480px;">
            <h2 style="margin-bottom: 1rem;">Manage Item Types</h2>
            <p style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1.2rem;">Add custom item types for your catalog. Stored in database.</p>
            
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1.2rem;">
                <input type="text" id="new-type-input" placeholder="e.g. package, subscription, membership" 
                    style="flex: 1; padding: 0.7rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
                <button type="button" class="btn-primary" onclick="addCustomType()"><i class="ph-bold ph-plus"></i> Add</button>
            </div>

            <div id="types-list" style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 200px; overflow-y: auto; margin-bottom: 1.5rem;">
                <!-- Dynamically rendered list of types -->
            </div>

            <div style="display: flex; justify-content: flex-end;">
                <button type="button" class="btn-secondary" onclick="closeTypesModal()">Done</button>
            </div>
        </div>
    </div>

    <script>
        let catalogItems = [];
        let catalogTypes = ['product', 'service'];
        let activeFilter = '';
        const accountId = localStorage.getItem('activeAccountId');
        const token = localStorage.getItem('token');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!accountId) {
                alert('No active account selected. Redirecting to accounts page...');
                window.location.href = '/accounts.html';
                return;
            }
            await loadSettingsAndTypes();
            loadCatalog();
        });

        async function loadSettingsAndTypes() {
            try {
                const res = await fetch('/api/settings', {
                    headers: { 'x-account-id': accountId, 'x-auth-token': token }
                });
                if (res.ok) {
                    const settings = await res.json();
                    if (Array.isArray(settings.customCatalogTypes) && settings.customCatalogTypes.length > 0) {
                        catalogTypes = settings.customCatalogTypes;
                    }
                }
            } catch (err) {
                console.error('Failed to load catalog types from DB settings:', err);
            }
            renderTypeFilterButtons();
            renderTypeSelectDropdown();
        }

        function renderTypeFilterButtons() {
            const container = document.getElementById('filter-buttons');
            let html = `<button class="btn-secondary ${activeFilter === '' ? 'active-filter' : ''}" onclick="filterCatalog('', this)">All Items</button>`;
            catalogTypes.forEach(t => {
                const label = t.charAt(0).toUpperCase() + t.slice(1);
                html += `<button class="btn-secondary ${activeFilter === t ? 'active-filter' : ''}" onclick="filterCatalog('${t}', this)">${label}s</button>`;
            });
            container.innerHTML = html;
        }

        function renderTypeSelectDropdown() {
            const select = document.getElementById('item-type');
            select.innerHTML = catalogTypes.map(t => {
                const label = t.charAt(0).toUpperCase() + t.slice(1);
                return `<option value="${t}">${label}</option>`;
            }).join('');
        }

        function openTypesModal() {
            renderTypesListInModal();
            document.getElementById('types-modal').classList.add('active');
        }

        function closeTypesModal() {
            document.getElementById('types-modal').classList.remove('active');
        }

        function renderTypesListInModal() {
            const list = document.getElementById('types-list');
            list.innerHTML = catalogTypes.map(t => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 0.6rem 0.9rem; border-radius: 8px;">
                    <span style="font-weight: 600; text-transform: capitalize;">${t}</span>
                    ${catalogTypes.length > 1 ? `<button class="icon-btn" onclick="removeCustomType('${t}')" style="color: #e74c3c;"><i class="ph-bold ph-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        async function addCustomType() {
            const input = document.getElementById('new-type-input');
            const val = input.value.trim().toLowerCase().replace(/[^a-z0-9_\-]/g, '');
            if (!val) return;
            if (catalogTypes.includes(val)) {
                alert('Type already exists.');
                return;
            }
            catalogTypes.push(val);
            input.value = '';
            await saveTypesToDB();
        }

        async function removeCustomType(typeToRemove) {
            if (catalogTypes.length <= 1) {
                alert('You must keep at least one catalog type.');
                return;
            }
            catalogTypes = catalogTypes.filter(t => t !== typeToRemove);
            await saveTypesToDB();
        }

        async function saveTypesToDB() {
            try {
                const res = await fetch('/api/settings', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-account-id': accountId,
                        'x-auth-token': token
                    },
                    body: JSON.stringify({ customCatalogTypes: catalogTypes })
                });
                if (res.ok) {
                    renderTypesListInModal();
                    renderTypeFilterButtons();
                    renderTypeSelectDropdown();
                } else {
                    alert('Failed to save custom types to database.');
                }
            } catch (err) {
                console.error('Error saving custom catalog types:', err);
                alert('Error saving custom catalog types to database.');
            }
        }

        async function loadCatalog() {
            try {
                const res = await fetch(`/api/catalog${activeFilter ? '?type=' + activeFilter : ''}`, {
                    headers: {
                        'x-account-id': accountId,
                        'x-auth-token': token
                    }
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    console.error('Failed to load catalog:', res.status, errData);
                    const container = document.getElementById('catalog-container');
                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #e74c3c; padding: 3rem;">
                        <i class="ph-bold ph-warning" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>
                        Failed to load catalog (${errData.msg || 'Server error'}).
                    </div>`;
                    return;
                }

                catalogItems = await res.json();
                renderCatalog();
            } catch (err) {
                console.error('Failed to load catalog:', err);
                const container = document.getElementById('catalog-container');
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #e74c3c; padding: 3rem;">
                    <i class="ph-bold ph-warning" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>
                    Network or server connection error.
                </div>`;
            }
        }

        function filterCatalog(type, btn) {
            activeFilter = type;
            if (btn) {
                document.querySelectorAll('.catalog-header-actions .btn-secondary').forEach(b => b.classList.remove('active-filter'));
                btn.classList.add('active-filter');
            }
            loadCatalog();
        }

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            if (!Array.isArray(catalogItems) || catalogItems.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 3rem;">No catalog items found. Click "Add Item" to create one.</div>`;
                return;
            }

            container.innerHTML = catalogItems.map(item => {
                const name = item.fields?.name || 'Unnamed Item';
                const variants = Array.isArray(item.fields?.variants) ? item.fields.variants : [];
                let priceDisplay = 'N/A';

                if (variants.length > 0) {
                    const prices = variants.map(v => Number(v.price)).filter(p => !isNaN(p));
                    if (prices.length > 0) {
                        const min = Math.min(...prices);
                        const max = Math.max(...prices);
                        priceDisplay = min === max ? `Rs. ${min}` : `Rs. ${min} - Rs. ${max}`;
                    }
                } else if (item.fields?.price !== undefined && item.fields?.price !== null) {
                    priceDisplay = `Rs. ${item.fields.price}`;
                }

                const category = item.fields?.category || '';
                const imageId = item.fields?.imageId || item.fields?.mediaId || '';
                const status = item.status || 'available';

                return `
                    <div class="catalog-card">
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem;">
                                <span class="type-badge ${item.type === 'product' ? 'type-product' : 'type-service'}">
                                    <i class="${item.type === 'product' ? 'ph-bold ph-package' : 'ph-bold ph-scissors'}"></i> ${item.type}
                                </span>
                                <span class="item-status status-${status}">${status}</span>
                            </div>
                            <h3 style="margin-bottom: 0.5rem;">${name}</h3>
                            <div class="fields-list">
                                <div class="field-row"><span>Price:</span> <strong>${priceDisplay}</strong></div>
                                ${category ? `<div class="field-row"><span>Category:</span> <span>${category}</span></div>` : ''}
                                ${imageId ? `<div class="field-row"><span>Media ID:</span> <span style="font-family: monospace; color: #3498db; font-size: 0.8rem;">${imageId}</span></div>` : ''}
                                ${variants.length > 0 ? `
                                    <div style="margin-top: 0.4rem; padding-top: 0.4rem; border-top: 1px dashed rgba(255,255,255,0.08);">
                                        <div style="font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.3rem;">Variants (${variants.length}):</div>
                                        <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
                                            ${variants.map(v => `<span style="background: rgba(255,255,255,0.08); padding: 0.2rem 0.4rem; border-radius: 6px; font-size: 0.75rem; color: #e9edef;">${v.name}: <strong style="color: #3498db;">Rs. ${v.price}</strong></span>`).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.8rem;">
                            <button class="icon-btn" onclick="editItem('${item._id}')" title="Edit"><i class="ph-bold ph-pencil-simple"></i></button>
                            <button class="icon-btn" onclick="deleteItem('${item._id}')" title="Delete" style="color: #e74c3c;"><i class="ph-bold ph-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addVariantRow(name = '', price = '') {
            const list = document.getElementById('variants-list');
            const row = document.createElement('div');
            row.className = 'variant-row';
            row.style.cssText = 'display: flex; gap: 0.5rem; align-items: center;';
            row.innerHTML = `
                <input type="text" placeholder="Variant (e.g. 500g, Red / XL)" value="${name}" class="variant-name"
                    style="flex: 2; padding: 0.5rem; border-radius: 8px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); font-size: 0.82rem;">
                <input type="number" placeholder="Price" value="${price}" class="variant-price"
                    style="flex: 1; padding: 0.5rem; border-radius: 8px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); font-size: 0.82rem;">
                <button type="button" class="icon-btn" onclick="this.parentElement.remove()" style="color: #e74c3c; padding: 0.4rem;"><i class="ph-bold ph-trash"></i></button>
            `;
            list.appendChild(row);
        }

        function renderVariants(variants = []) {
            const list = document.getElementById('variants-list');
            list.innerHTML = '';
            if (Array.isArray(variants) && variants.length > 0) {
                variants.forEach(v => addVariantRow(v.name || '', v.price !== undefined ? v.price : ''));
            }
        }

        function getVariantsFromForm() {
            const rows = document.querySelectorAll('#variants-list .variant-row');
            const variants = [];
            rows.forEach(row => {
                const name = row.querySelector('.variant-name').value.trim();
                const price = row.querySelector('.variant-price').value.trim();
                if (name) {
                    variants.push({
                        name,
                        price: price ? Number(price) : 0
                    });
                }
            });
            return variants;
        }

        function openCreateModal() {
            document.getElementById('modal-title').innerText = 'Add Catalog Item';
            document.getElementById('item-id').value = '';
            document.getElementById('item-form').reset();
            renderVariants([]);
            document.getElementById('item-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.remove('active');
        }

        function editItem(id) {
            const item = catalogItems.find(i => i._id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = 'Edit Catalog Item';
            document.getElementById('item-id').value = item._id;
            document.getElementById('item-type').value = item.type;
            document.getElementById('field-name').value = item.fields?.name || '';
            document.getElementById('field-price').value = item.fields?.price !== undefined ? item.fields.price : '';
            document.getElementById('field-image-id').value = item.fields?.imageId || item.fields?.mediaId || '';
            document.getElementById('field-category').value = item.fields?.category || '';
            document.getElementById('field-description').value = item.fields?.description || '';
            document.getElementById('item-status').value = item.status || 'available';

            renderVariants(item.fields?.variants || []);

            document.getElementById('item-modal').classList.add('active');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const type = document.getElementById('item-type').value;
            const name = document.getElementById('field-name').value;
            const price = document.getElementById('field-price').value;
            const imageId = document.getElementById('field-image-id').value;
            const category = document.getElementById('field-category').value;
            const description = document.getElementById('field-description').value;
            const status = document.getElementById('item-status').value;
            const variants = getVariantsFromForm();

            const payload = {
                type,
                status,
                fields: {
                    name,
                    price: price ? Number(price) : undefined,
                    imageId: imageId ? imageId.trim() : undefined,
                    category: category || undefined,
                    description: description || undefined,
                    variants: variants.length > 0 ? variants : undefined
                }
            };

            try {
                const url = id ? `/api/catalog/${id}` : '/api/catalog';
                const method = id ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'x-account-id': accountId,
                        'x-auth-token': token
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal();
                    loadCatalog();
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert('Error: ' + (err.msg || 'Save failed'));
                }
            } catch (err) {
                console.error('Submit error:', err);
                alert('Submit failed: Network or server error');
            }
        }

        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this catalog item?')) return;
            try {
                const res = await fetch(`/api/catalog/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'x-account-id': accountId,
                        'x-auth-token': token
                    }
                });
                if (res.ok) {
                    loadCatalog();
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert('Delete error: ' + (err.msg || 'Delete failed'));
                }
            } catch (err) {
                console.error('Delete error:', err);
                alert('Delete error: Network or server error');
            }
        }
    </script>
</body>

</html>
