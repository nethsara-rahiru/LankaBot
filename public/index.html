<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LankaBot | Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --bg: #000000;
        }
        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: pulse 2s infinite ease-in-out;
        }
        .logo i { color: var(--primary); }
        .logo span { color: var(--primary); }
        
        .loading-container {
            width: 250px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .loading-bar {
            width: 40%;
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            position: absolute;
            left: -40%;
            animation: loading 1.5s infinite linear;
            box-shadow: 0 0 15px var(--primary);
        }

        @keyframes loading {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .status-text {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 1px;
            text-transform: none;
            max-width: 300px;
            text-align: center;
        }
        .error-link {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div class="logo">
        <i class="ph-fill ph-robot"></i>
        <div>Lanka<span>Bot</span></div>
    </div>
    
    <div class="loading-container">
        <div class="loading-bar"></div>
    </div>
    
    <p id="status-text" class="status-text">Booting System...</p>
    <div id="error-action" class="error-link" onclick="window.location.reload()">System taking too long? Click to refresh</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const statusText = document.getElementById('status-text');
        const errorAction = document.getElementById('error-action');

        // Auth Check
        if (!localStorage.getItem('token')) {
            window.location.href = '/login.html';
        } else {
            // If authenticated, go to dashboard (which will handle account selection)
            if (statusText) statusText.textContent = 'System verified. Launching...';
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1500);
        }

        const socket = io();

        socket.on('connect', () => {
            console.log('Connected to server');
        });
    </script>
</body>
</html>
